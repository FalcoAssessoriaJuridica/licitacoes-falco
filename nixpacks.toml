# Nixpacks pegava Node 18 (Vite 7 + Tailwind v4 exigem 20+) e, ao detectar
# site Vite, trocava o start por um Caddy próprio. O EasyPanel roteia os
# domínios para a porta 80 do contêiner (http://...:80/). Então:
#  - Node 22
#  - start = serve o dist/ na porta 80 (contêiner roda como root, pode bindar 80)

[phases.setup]
nixPkgs = ["nodejs_22"]

[start]
cmd = "serve -s dist -l 80"
