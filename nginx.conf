server {
    listen 80;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check direto para qualquer monitor/probe
    location = /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    location = /api/health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # SPA routing — todas as rotas caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para assets com hash (gerados pelo Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache de ícones e manifest
    location ~* \.(png|ico|json|webmanifest|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
